<section id="contacto" class="bg-paper">
  <div class="mx-auto grid max-w-6xl gap-12 px-6 py-24 lg:grid-cols-[0.85fr_1.15fr]">
    <div>
      <app-section-heading index="06" title="Contacto" kicker="Si buscas un junior que ya ha cerrado el ciclo completo, escríbeme." />
      <div class="flex flex-wrap items-center gap-3">
        <a class="font-medium text-navy underline decoration-line underline-offset-4" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
        <button type="button" class="rounded-full border border-line px-3 py-1 text-xs font-semibold text-steel" (click)="copyEmail()">
          {{ copied() ? 'Copiado' : 'Copiar' }}
        </button>
      </div>
      <p class="sr-only" aria-live="polite">{{ copied() ? 'Correo copiado' : '' }}</p>
      <ul class="mt-4 space-y-3 text-sm">
        <li><a class="font-medium text-navy underline decoration-line underline-offset-4" [href]="profile.phoneHref">{{ profile.phone }}</a></li>
        <li class="text-muted">{{ profile.location }}, {{ profile.postalCode }}</li>
        <li><a class="font-medium text-steel" [href]="profile.cvPath" download>Descargar CV</a></li>
      </ul>
    </div>

    <form class="rounded-[1.75rem] border border-line bg-mist p-6 sm:p-8" [formGroup]="form" (ngSubmit)="send()" novalidate>
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-sm">
          <span class="font-medium">Nombre</span>
          <input class="mt-2 w-full rounded-2xl border border-line bg-paper px-4 py-3 outline-none focus:border-steel" type="text" formControlName="name" autocomplete="name" />
          @if (invalid('name')) {
            <span class="mt-1 block text-xs text-steel">Escribe tu nombre.</span>
          }
        </label>
        <label class="block text-sm">
          <span class="font-medium">Correo</span>
          <input class="mt-2 w-full rounded-2xl border border-line bg-paper px-4 py-3 outline-none focus:border-steel" type="email" formControlName="email" autocomplete="email" />
          @if (invalid('email')) {
            <span class="mt-1 block text-xs text-steel">Necesito un correo válido.</span>
          }
        </label>
      </div>
      <label class="mt-4 block text-sm">
        <span class="font-medium">Mensaje</span>
        <textarea class="mt-2 min-h-36 w-full rounded-2xl border border-line bg-paper px-4 py-3 outline-none focus:border-steel" formControlName="message"></textarea>
        @if (invalid('message')) {
          <span class="mt-1 block text-xs text-steel">Cuéntame un poco más, al menos 10 caracteres.</span>
        }
      </label>
      <button class="mt-5 rounded-full bg-ink px-5 py-3 text-sm font-semibold text-paper transition hover:bg-navy" type="submit">
        Abrir correo
      </button>
      <p class="mt-3 text-xs text-muted">Abre tu cliente de correo con el mensaje escrito. No hay backend detrás.</p>
    </form>
  </div>
</section>
