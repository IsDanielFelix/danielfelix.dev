<section id="proyectos" class="bg-mist">
  <div class="mx-auto max-w-6xl px-6 py-24">
    <app-section-heading
      index="03"
      title="Proyectos"
      kicker="Sin capturas inventadas. Cuando haya pantallazos reales, se añaden aquí."
    />
    <div class="grid gap-5">
      @for (project of projects; track project.slug) {
        <article class="rounded-[1.75rem] border border-line bg-paper p-7 sm:p-9">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <p class="text-xs font-semibold uppercase tracking-[0.16em] text-steel">{{ project.kind }}</p>
            @if (project.here) {
              <span class="rounded-full bg-ink px-3 py-1 text-xs font-semibold text-paper">Estás aquí</span>
            }
          </div>
          <h3 class="mt-4 font-display text-4xl tracking-tight sm:text-5xl">{{ project.name }}</h3>
          <p class="mt-4 max-w-3xl text-base leading-relaxed text-muted">{{ project.summary }}</p>
          <ul class="mt-6 grid gap-2 text-sm text-navy sm:grid-cols-2">
            @for (point of project.highlights; track point) {
              <li class="flex gap-3 rounded-2xl bg-mist px-4 py-3">
                <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-steel"></span>
                <span>{{ point }}</span>
              </li>
            }
          </ul>
          <div class="mt-6 flex flex-wrap gap-2">
            @for (tech of project.stack; track tech) {
              <app-tag>{{ tech }}</app-tag>
            }
          </div>
          <div class="mt-8">
            <a class="text-sm font-semibold text-navy underline decoration-line underline-offset-4" [routerLink]="['/proyectos', project.slug]">
              Ver detalle
            </a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
