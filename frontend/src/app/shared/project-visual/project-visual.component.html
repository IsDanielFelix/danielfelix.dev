<div class="relative flex h-full min-h-64 flex-col justify-between bg-ink p-7 text-paper">
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_bottom_left,rgba(57,84,117,0.95),transparent_58%)]"></div>
  <div class="relative">
    <p class="text-xs uppercase tracking-[0.18em] text-white/55">{{ label() }}</p>
    <div class="mt-6 rounded-2xl border border-white/10 bg-white/5 p-4" aria-hidden="true">
      <div class="flex gap-1.5">
        <span class="h-2 w-2 rounded-full bg-white/30"></span>
        <span class="h-2 w-2 rounded-full bg-white/20"></span>
        <span class="h-2 w-2 rounded-full bg-white/10"></span>
      </div>
      <div class="mt-4 grid grid-cols-3 gap-2">
        <div class="col-span-2 h-16 rounded-lg bg-white/10"></div>
        <div class="h-16 rounded-lg bg-white/5"></div>
      </div>
      <div class="mt-2 h-2 w-2/3 rounded-full bg-white/20"></div>
      <div class="mt-2 h-2 w-1/2 rounded-full bg-white/10"></div>
    </div>
  </div>
  <div class="relative mt-6 flex items-end justify-between gap-4">
    <p class="font-display text-5xl">{{ mark() }}</p>
    <p class="max-w-32 text-right text-xs leading-snug text-white/45">Esquema visual, no es una captura.</p>
  </div>
</div>
