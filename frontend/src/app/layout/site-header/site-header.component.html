<header class="fixed inset-x-0 top-0 z-40 border-b border-line bg-paper">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-5 sm:px-6">
    <a routerLink="/" fragment="inicio" class="flex min-w-0 items-center gap-3 text-ink" (click)="closeMenu()">
      <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-ink text-sm font-semibold text-paper">DF</span>
      <span class="truncate text-sm font-semibold tracking-wide">{{ profile.name }}</span>
    </a>

    <nav class="hidden items-center gap-1 lg:flex" aria-label="Secciones">
      @for (item of navigation; track item.fragment) {
        <a
          class="rounded-full px-3 py-1.5 text-[13px] font-medium"
          [class]="isActive(item.fragment) ? 'bg-ink text-paper' : 'text-muted hover:text-ink'"
          [attr.aria-current]="isActive(item.fragment) ? 'true' : null"
          routerLink="/"
          [fragment]="item.fragment"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="grid h-10 w-10 place-items-center rounded-lg border border-line text-ink lg:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-movil"
      (click)="toggleMenu()"
    >
      <span class="sr-only">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      @if (menuOpen()) {
        <span class="text-lg leading-none" aria-hidden="true">×</span>
      } @else {
        <span class="flex flex-col gap-1.5" aria-hidden="true">
          <span class="block h-px w-4 bg-current"></span>
          <span class="block h-px w-4 bg-current"></span>
        </span>
      }
    </button>
  </div>

  @if (menuOpen()) {
    <nav id="menu-movil" class="border-t border-line bg-paper px-3 py-3 lg:hidden" aria-label="Secciones">
      @for (item of navigation; track item.fragment) {
        <a
          class="block rounded-xl px-3 py-3 text-sm font-medium"
          [class]="isActive(item.fragment) ? 'bg-ink text-paper' : 'text-ink'"
          [attr.aria-current]="isActive(item.fragment) ? 'true' : null"
          routerLink="/"
          [fragment]="item.fragment"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  }
</header>
