<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-page px-5 text-content sm:px-8"
>
  <!-- Brillo decorativo de fondo -->
  <div
    class="pointer-events-none absolute -right-32 -top-32 size-96 rounded-full bg-brand-soft blur-3xl"
  ></div>

  <div
    class="pointer-events-none absolute -bottom-48 -left-32 size-96 rounded-full bg-brand-soft opacity-60 blur-3xl"
  ></div>

  <!-- Botón para alternar modo claro/oscuro -->
  <button
    type="button"
    (click)="toggleTheme()"
    class="absolute right-5 top-5 flex size-10 items-center justify-center rounded-xl border border-border bg-surface/80 text-lg text-content backdrop-blur transition hover:border-brand hover:text-brand focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand sm:right-8 sm:top-8"
    [attr.aria-label]="theme === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
  >
    @if (theme === 'dark') {
      <span aria-hidden="true">☀</span>
    } @else {
      <span aria-hidden="true">☾</span>
    }
  </button>

  <!-- Contenido central -->
  <section class="relative z-10 mx-auto w-full max-w-xl text-center">
    <div
      class="mx-auto flex size-16 items-center justify-center rounded-2xl bg-brand text-lg font-black text-brand-content shadow-xl shadow-brand/20"
      aria-label="Iniciales de Daniel Felix"
    >
      DF
    </div>

    <p
      class="mt-8 text-xs font-bold uppercase tracking-[0.22em] text-brand"
    >
      Daniel Felix · Desarrollador web
    </p>

    <h1
      class="mt-5 text-4xl font-bold tracking-[-0.055em] sm:text-6xl"
    >
      Web en construcción.
    </h1>

    <p class="mx-auto mt-5 max-w-md text-lg leading-8 text-muted">
      Estoy preparando un portfolio donde podrás conocer mis proyectos,
      tecnologías y experiencia.
    </p>

    <div class="mx-auto mt-9 h-px w-16 bg-brand"></div>

    <p class="mt-7 text-sm text-muted">
      Vuelve pronto.
    </p>
  </section>

  <!-- Pie inferior -->
  <footer
    class="absolute bottom-5 left-5 right-5 flex items-center justify-between text-xs text-muted sm:bottom-8 sm:left-8 sm:right-8"
  >
    <span>© 2026 Daniel Felix</span>

    <span class="flex items-center gap-2">
      <span class="size-2 rounded-full bg-brand"></span>
      Construyendo algo nuevo
    </span>
  </footer>
</main>
